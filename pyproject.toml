[project]
name = "dna-analyzer"
version = "1.0.0"
description = "Bioinformatics Sequence Analysis & Phylogenetic Toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flet>=0.82.0",
]

[tool.flet]
org = "com.rakib.dnaanalyzer"
